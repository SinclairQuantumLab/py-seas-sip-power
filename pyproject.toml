[project]
name = "py-seas-sip-power"
version = "0.1.0"
description = "Synchronous SAES SIP POWER UDP readings and explicit HV control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["seas_sip_client"]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.15"]
notebook = ["ipykernel>=7.3.0"]

[tool.pytest.ini_options]
testpaths = [".agents"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "E4", "E7", "E9", "F", "I", "UP"]
