[project]
name = "py-seas-sip-power"
version = "0.1.0"
description = "Unified synchronous SAES SIP POWER device API over UDP and Modbus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["seas_sip_client"]

[dependency-groups]
dev = ["pytest>=9.0", "ruff>=0.15", {include-group = "notebook"}]
notebook = ["ipykernel>=7.3.0", "jupytext>=1.18"]

[tool.pytest.ini_options]
testpaths = [".agents"]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"demo.py" = ["D100"]
